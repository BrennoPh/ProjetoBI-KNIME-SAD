<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    width: 1920px;
    height: 1080px;
    background: #895bf6;
    overflow: hidden;
    position: relative;
    color: #FFFFFF;
  }
  .left-content {
    position: absolute;
    left: 80px;
    top: 110px;
    width: 1000px;
    z-index: 10;
  }
  .top-pill {
    display: inline-flex;
    align-items: center;
    background: #331163;
    color: #E9D5FF;
    padding: 14px 28px;
    border-radius: 9999px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .main-title {
    font-size: 115px;
    font-weight: 900;
    line-height: 0.94;
    letter-spacing: -4px;
    color: #FFFFFF;
    margin-bottom: 24px;
  }
  .subtitle {
    font-size: 38px;
    font-weight: 500;
    color: #F3E8FF;
    line-height: 1.3;
    margin-bottom: 40px;
    max-width: 900px;
  }
  .action-badge {
    display: inline-block;
    background: #280a52;
    color: #FFFFFF;
    padding: 18px 42px;
    border-radius: 9999px;
    font-size: 24px;
    font-weight: 700;
    box-shadow: 0 12px 30px rgba(40, 10, 82, 0.45);
    margin-bottom: 80px;
  }
  .authors-bar {
    border-top: 2px solid rgba(255, 255, 255, 0.25);
    padding-top: 28px;
    font-size: 21px;
    color: #E9D5FF;
    letter-spacing: 0.5px;
  }
  .authors-bar strong { color: #FFFFFF; }
</style>
</head>
<body>
  <div class="left-content">
    <div class="top-pill">Sistemas de Apoio à Decisão • UFS</div>
    <h1 class="main-title">KNIME<br>Analytics</h1>
    <p class="subtitle">Automação Analítica e Predição de Churn em Telecomunicações</p>
    <div class="action-badge">Case Prático • Grupo 12</div>
    <div class="authors-bar">
      <strong>Equipe:</strong> Brenno Phelipe • David Santos • Gabriel Lima • Paulo Henrique
    </div>
  </div>
</body>
</html>
