<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    width: 420px;
    height: 700px;
    background: transparent;
    overflow: hidden;
    padding: 20px;
  }
  .phone-mockup {
    width: 380px;
    height: 650px;
    background: #1c0a3d;
    border-radius: 48px;
    border: 10px solid #331463;
    box-shadow: 0 35px 70px -15px rgba(20, 5, 50, 0.75);
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .notch {
    width: 120px;
    height: 24px;
    background: #0f0422;
    border-radius: 12px;
    margin: 0 auto 10px auto;
  }
  .alert-banner {
    background: #EF4444;
    color: #FFFFFF;
    padding: 16px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .alert-body {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .alert-body h4 { font-size: 18px; color: #FFFFFF; }
  .alert-body p { font-size: 14px; color: #DDD6FE; line-height: 1.4; }
  .action-btn {
    background: #FFFFFF;
    color: #1c0a3d;
    padding: 16px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    margin-top: auto;
  }
</style>
</head>
<body>
  <div class="phone-mockup">
    <div class="notch"></div>
    <div class="alert-banner">
      <span>🚨</span> ALERTA DE EVASÃO
    </div>
    <div class="alert-body">
      <h4>Segmento Pré-Pago & Fibra</h4>
      <p>Modelo detectou alta probabilidade de cancelamento antes do encerramento do contrato.</p>
      <p><strong>Impacto:</strong> 318 assinantes em zona de saída imediata.</p>
    </div>
    <div class="action-btn">Acionar Retenção Prescritiva</div>
  </div>
</body>
</html>
