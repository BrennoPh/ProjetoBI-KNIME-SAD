<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    width: 1920px;
    height: 1080px;
    background: #895bf6;
    overflow: hidden;
    position: relative;
    color: #FFFFFF;
  }
  .left-content {
    position: absolute;
    left: 120px;
    top: 180px;
    width: 860px;
    z-index: 10;
  }
  .top-pill {
    display: inline-flex;
    align-items: center;
    background: #331163;
    color: #E9D5FF;
    padding: 10px 22px;
    border-radius: 9999px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .main-title {
    font-size: 96px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -3px;
    color: #FFFFFF;
    margin-bottom: 20px;
  }
  .subtitle {
    font-size: 32px;
    font-weight: 400;
    color: #F3E8FF;
    line-height: 1.35;
    margin-bottom: 36px;
    max-width: 760px;
  }
  .action-badge {
    display: inline-block;
    background: #280a52;
    color: #FFFFFF;
    padding: 14px 34px;
    border-radius: 9999px;
    font-size: 20px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(40, 10, 82, 0.4);
    margin-bottom: 70px;
  }
  .authors-bar {
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 24px;
    font-size: 17px;
    color: #E9D5FF;
    letter-spacing: 0.5px;
  }
  .authors-bar strong { color: #FFFFFF; }
</style>
</head>
<body>
  <div class="left-content">
    <div class="top-pill">Sistemas de Apoio à Decisão • UFS</div>
    <h1 class="main-title">KNIME<br>Analytics</h1>
    <p class="subtitle">Automação Analítica e Predição Preditiva de Churn em Telecomunicações</p>
    <div class="action-badge">Case Prático • Grupo 12</div>
    <div class="authors-bar">
      <strong>Equipe:</strong> Brenno Phelipe • David Santos • Gabriel Lima • Paulo Henrique
    </div>
  </div>
</body>
</html>
