<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%" style="background-color:#0f172a; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="950" height="60" fill="#1e293b"/>
  <text x="25" y="38" font-size="18" font-weight="bold" fill="#f8fafc">KNIME Interactive Component — Painel de Apoio à Decisão (SAD - Retenção de Clientes)</text>
  <rect x="820" y="18" width="105" height="26" rx="6" fill="#10b981"/>
  <text x="872" y="35" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ATIVO (LIVE)</text>

  <!-- KPI Cards -->
  <rect x="25" y="80" width="210" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="105" font-size="12" fill="#94a3b8">BASE TOTAL ANALISADA</text>
  <text x="40" y="145" font-size="28" font-weight="bold" fill="#f8fafc">1.200</text>
  <text x="40" y="165" font-size="11" fill="#38bdf8">Clientes rastreados</text>

  <rect x="260" y="80" width="210" height="95" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="275" y="105" font-size="12" fill="#f87171">TAXA GLOBAL DE CHURN</text>
  <text x="275" y="145" font-size="28" font-weight="bold" fill="#ef4444">41.8%</text>
  <text x="275" y="165" font-size="11" fill="#fca5a5">502 clientes em evasão</text>

  <rect x="495" y="80" width="210" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="510" y="105" font-size="12" fill="#94a3b8">CONTRATOS MENSAIS (RISCO)</text>
  <text x="510" y="145" font-size="28" font-weight="bold" fill="#fbbf24">57.9%</text>
  <text x="510" y="165" font-size="11" fill="#fde047">Concentração do churn</text>

  <rect x="730" y="80" width="195" height="95" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="745" y="105" font-size="12" fill="#86efac">ACURÁCIA DO MODELO</text>
  <text x="745" y="145" font-size="28" font-weight="bold" fill="#10b981">84.7%</text>
  <text x="745" y="165" font-size="11" fill="#a7f3d0">Árvore de Decisão</text>

  <!-- Left Chart: Churn por Tipo de Contrato -->
  <rect x="25" y="195" width="445" height="330" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="45" y="225" font-size="14" font-weight="bold" fill="#f8fafc">Taxa de Churn por Tipo de Contrato</text>
  <!-- Bar Mensal -->
  <text x="45" y="265" font-size="12" fill="#cbd5e1">Contrato Mensal</text>
  <rect x="170" y="250" width="220" height="20" rx="4" fill="#ef4444"/>
  <text x="400" y="265" font-size="12" font-weight="bold" fill="#ef4444">57.9%</text>

  <!-- Bar Anual -->
  <text x="45" y="310" font-size="12" fill="#cbd5e1">Contrato Anual</text>
  <rect x="170" y="295" width="85" height="20" rx="4" fill="#3b82f6"/>
  <text x="265" y="310" font-size="12" font-weight="bold" fill="#3b82f6">22.4%</text>

  <!-- Bar 2 Anos -->
  <text x="45" y="355" font-size="12" fill="#cbd5e1">Contrato 2 Anos</text>
  <rect x="170" y="340" width="74" height="20" rx="4" fill="#10b981"/>
  <text x="255" y="355" font-size="12" font-weight="bold" fill="#10b981">19.6%</text>

  <!-- Reclamações Impacto -->
  <line x1="45" y1="390" x2="440" y2="390" stroke="#334155" stroke-width="1"/>
  <text x="45" y="415" font-size="13" font-weight="bold" fill="#f8fafc">Gatilho de Decisão: Chamadas ao Suporte</text>
  <text x="45" y="440" font-size="11.5" fill="#94a3b8">• 0 a 2 Chamadas: Churn médio de ~36%</text>
  <text x="45" y="465" font-size="11.5" fill="#f87171">• 3 ou mais Chamadas: Churn salta para 63.8% (Alerta Vermelho)</text>
  <text x="45" y="490" font-size="11.5" fill="#fbbf24">• Sem Suporte Técnico: Taxa de perda sobe para 52.7%</text>

  <!-- Right Table: Ações Recomendadas para Suporte à Decisão -->
  <rect x="495" y="195" width="430" height="330" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="515" y="225" font-size="14" font-weight="bold" fill="#f8fafc">Plano de Ação Gerencial (SAD)</text>
  
  <rect x="515" y="245" width="390" height="75" rx="6" fill="#334155" stroke="#ef4444" stroke-width="1"/>
  <text x="525" y="267" font-size="12" font-weight="bold" fill="#ef4444">AÇÃO 1: Intervenção Imediata no SAC</text>
  <text x="525" y="287" font-size="11" fill="#cbd5e1">Clientes com &gt;= 3 chamadas no mês recebem contato direto</text>
  <text x="525" y="305" font-size="11" fill="#cbd5e1">de gestor de contas + voucher de desconto de 20%.</text>

  <rect x="515" y="335" width="390" height="75" rx="6" fill="#334155" stroke="#fbbf24" stroke-width="1"/>
  <text x="525" y="357" font-size="12" font-weight="bold" fill="#fbbf24">AÇÃO 2: Migração de Contratos Mensais</text>
  <text x="525" y="377" font-size="11" fill="#cbd5e1">Campanha de upgrade para plano Anual com 1 mês grátis,</text>
  <text x="525" y="395" font-size="11" fill="#cbd5e1">reduzindo a propensão de evasão de 57.9% para 22.4%.</text>

  <rect x="515" y="425" width="390" height="80" rx="6" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="525" y="447" font-size="12" font-weight="bold" fill="#10b981">AÇÃO 3: Pacote Suporte Técnico Gratuito</text>
  <text x="525" y="467" font-size="11" fill="#cbd5e1">Oferecer 3 meses de Suporte Técnico gratuito para fibra óptica,</text>
  <text x="525" y="485" font-size="11" fill="#cbd5e1">blindando a base de maior receita mensal.</text>
</svg>