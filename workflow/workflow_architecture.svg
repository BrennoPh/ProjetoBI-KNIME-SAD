<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" style="background-color:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1100" height="55" fill="#ffaa00" />
  <text x="20" y="35" font-size="20" font-weight="bold" fill="#1a202c">KNIME Analytics Platform — Workflow: Sistema de Apoio à Decisão (SAD - Churn)</text>
  <text x="880" y="35" font-size="13" fill="#2d3748">Grupo 12 (SAD - UFS)</text>

  <!-- Section Annotations -->
  <rect x="25" y="75" width="320" height="310" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-dasharray="4" />
  <text x="40" y="100" font-size="14" font-weight="bold" fill="#2b6cb0">1. Ingestão &amp; Tratamento (ETL)</text>

  <rect x="365" y="75" width="360" height="310" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-dasharray="4" />
  <text x="380" y="100" font-size="14" font-weight="bold" fill="#d69e2e">2. Modelagem Preditiva (SAD)</text>

  <rect x="745" y="75" width="330" height="310" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-dasharray="4" />
  <text x="760" y="100" font-size="14" font-weight="bold" fill="#38a169">3. Avaliação &amp; Suporte à Decisão</text>

  <!-- Connectors -->
  <!-- 1 -> 2 -->
  <path d="M 140 185 L 180 185" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 2 -> 3 -->
  <path d="M 260 185 L 300 185" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 3 -> 4 -->
  <path d="M 380 185 L 420 185" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 4 -> 5 (Train) -->
  <path d="M 500 170 C 530 170, 540 150, 560 150" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 4 -> 6 (Test) -->
  <path d="M 500 200 C 530 200, 640 230, 680 230" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 5 -> 6 (Model Port) -->
  <path d="M 640 150 C 660 150, 660 180, 680 185" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 6 -> 7 (Scorer) -->
  <path d="M 760 195 C 790 195, 800 160, 830 160" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 6 -> 8 (Rule Engine) -->
  <path d="M 760 215 C 790 215, 800 270, 830 270" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 8 -> 9 (Bar Chart) -->
  <path d="M 910 260 C 930 260, 940 230, 960 230" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 8 -> 10 (Table View) -->
  <path d="M 910 280 C 930 280, 940 310, 960 310" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- NODES -->
  <!-- Node 1: CSV Reader -->
  <g transform="translate(60, 145)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">CSV Reader</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">📄</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Leitura Dados</text>
  </g>

  <!-- Node 2: Missing Value -->
  <g transform="translate(180, 145)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Missing Value</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">🧹</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Tratamento Nulos</text>
  </g>

  <!-- Node 3: Column Filter -->
  <g transform="translate(300, 145)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="9.5" font-weight="bold" fill="#000" text-anchor="middle">Column Filter</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">🔍</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Seleção Features</text>
  </g>

  <!-- Node 4: Partitioning -->
  <g transform="translate(420, 145)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Partitioning</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">⚖️</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Treino 70% / 30%</text>
  </g>

  <!-- Node 5: Decision Tree Learner -->
  <g transform="translate(560, 110)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">Tree Learner</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">🌳</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Gini / Regras</text>
  </g>

  <!-- Node 6: Decision Tree Predictor -->
  <g transform="translate(680, 165)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">Tree Predictor</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">🔮</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Score de Teste</text>
  </g>

  <!-- Node 7: Scorer -->
  <g transform="translate(830, 120)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">Scorer</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">📊</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Acurácia &amp; Matriz</text>
  </g>

  <!-- Node 8: Rule Engine -->
  <g transform="translate(830, 230)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Rule Engine</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">⚙️</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Nível de Risco SAD</text>
  </g>

  <!-- Node 9: Bar Chart -->
  <g transform="translate(960, 190)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Bar Chart</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">📈</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Visualização Interativa</text>
  </g>

  <!-- Node 10: Table View -->
  <g transform="translate(960, 290)" filter="url(#drop-shadow)">
    <rect width="80" height="80" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="22" rx="8" fill="#ffaa00"/>
    <text x="40" y="16" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Table View</text>
    <circle cx="40" cy="52" r="16" fill="#edf2f7" stroke="#718096"/>
    <text x="40" y="57" font-size="14" text-anchor="middle">📋</text>
    <rect x="28" y="88" width="24" height="8" rx="4" fill="#48bb78"/>
    <text x="40" y="110" font-size="10" fill="#4a5568" text-anchor="middle">Ação Gerencial</text>
  </g>

</svg>